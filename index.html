<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spooky-kiro</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial;text-align:center;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px}
h1{font-size:55px;margin:10px;text-shadow:0 0 20px #ff0000}
p{color:#ccc;font-size:18px;max-width:500px;line-height:1.7}
button{background:#ff0000;border:none;color:#fff;padding:15px 30px;font-size:20px;border-radius:50px;cursor:pointer;margin-top:20px}
button:hover{background:#a30000}
.ghost{font-size:90px;animation:float 2s infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
</style>
</head>
<body>
<div class="ghost">👻</div>
<h1>Spooky-kiro</h1>
<p>أهلا فيك في عالم الرعب... جاهز؟<br>اضغط الزر إذا كنت شجاع</p>
<button onclick="scare()">ادخل إذا بتقدر 😱</button>
<p id="msg" style="margin-top:20px;font-size:22px;color:#ff4444"></p>
<script>
function scare(){
document.getElementById('msg').innerText = 'ببببووووووو 👻👻👻';
}
</script>
</body>
</html>
